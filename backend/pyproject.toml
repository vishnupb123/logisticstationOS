[project]
name = "stationos-backend"
version = "0.1.0"
description = "StationOS backend — local-first logistics operations intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "duckdb>=1.0,<2.0",
    "structlog>=24.1,<25.0",
    # app/simulation (Milestone 4) and its Parquet output — core app
    # functionality, not a side tool, unlike dbt below.
    "simpy>=4.1,<5.0",
    "pyyaml>=6.0,<7.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=17.0,<18.0",
    # app/core/llm (Milestone 5) — the Ollama provider adapter makes real
    # HTTP calls; also used by FastAPI's TestClient (dev), so it was
    # already a transitive dev dependency, but now it's load-bearing
    # production code too.
    "httpx>=0.27,<1.0",
    # app/core/tracing (Milestone 9) — a ConsoleSpanExporter only, no
    # external collector; cross-cutting observability like structlog
    # above, not an optional research tool, so it's a base dependency
    # rather than an extra.
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
]
# Not a base runtime dependency — the API never invokes dbt itself; this
# backs the dbt project at backend/analytics/ (docs/ENGINEERING_ROADMAP.md
# M3), run as a separate CLI tool.
analytics = [
    # Pinned to the v1 CLI/project format (dbt now ships a v2) — v2 isn't
    # evaluated yet; revisit deliberately, don't drift onto it via a lax
    # version range.
    "dbt-core>=1.8,<2.0",
    "dbt-duckdb>=1.8,<2.0",
]
# Not a base runtime dependency — offline RL training/evaluation
# (docs/ENGINEERING_ROADMAP.md M6) is a research tool run via
# backend/scripts/, not something the FastAPI app invokes at request
# time. torch is heavy; keeping it out of the base install matters.
rl = [
    "gymnasium>=0.29,<1.1",
    "stable-baselines3>=2.3,<3.0",
    "torch>=2.2,<3.0",
]
# Not a base runtime dependency — offline predictive-model
# training/evaluation (docs/ENGINEERING_ROADMAP.md M8) is a research
# tool run via backend/scripts/, same reasoning as the `rl` extra above.
predictive = [
    "scikit-learn>=1.5,<1.6",
    # Transitive via scikit-learn, but imported directly
    # (app/predictive/jackpot_risk/predict.py) — pinned explicitly
    # rather than relying on whatever version scikit-learn happens to
    # pull in.
    "joblib>=1.4,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Alembic-generated migration files are machine-written and re-generated,
# not hand-styled — only line length is exempted, so a genuinely unused
# import or similar still gets caught.
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
