# Local-first dev stack (ADR-0001): PostgreSQL + the backend API. DuckDB is
# embedded (no server/container of its own) — the api service writes its
# DuckDB file into the mounted ./data volume, same as a non-Docker run.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stationos
      POSTGRES_PASSWORD: stationos
      POSTGRES_DB: stationos
    ports:
      # Host-side 5433 to avoid colliding with any other local Postgres on
      # the default 5432 — the api service still reaches this over the
      # internal Docker network at postgres:5432, unaffected by this remap.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stationos -d stationos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: stationos
      POSTGRES_PASSWORD: stationos
      POSTGRES_DB: stationos
    ports:
      # Host-side 8010 — this machine already has something else on 8000.
      - "8010:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
