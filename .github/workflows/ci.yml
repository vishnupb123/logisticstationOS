name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stationos
          POSTGRES_PASSWORD: stationos
          POSTGRES_DB: stationos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stationos -d stationos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: stationos
      POSTGRES_PASSWORD: stationos
      POSTGRES_DB: stationos

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,analytics]"

      - name: Lint
        run: ruff check .

      - name: Apply migrations (verifies alembic upgrade head on a fresh DB)
        run: alembic upgrade head

      # pytest now runs against its own <db>_test database
      # (tests/conftest.py), so it no longer wipes this seeded data —
      # the order below is kept simply because it reads naturally.
      - name: Seed synthetic data for the analytics pipeline
        run: python scripts/generate_synthetic_events.py --seed 42 --trucks 6 --parcels-per-truck 20 --seed-db

      - name: Export events to Parquet
        run: python scripts/export_events_to_parquet.py --out ../data/processed/events.parquet

      - name: dbt run
        working-directory: backend/analytics
        run: dbt run --profiles-dir .

      - name: dbt test
        working-directory: backend/analytics
        run: dbt test --profiles-dir .

      - name: Test
        run: pytest -q
